<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IXD" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="IXD 星图 — 让灵感漫步于星辰大海。探索六个专业方向、项目孵化、竞赛与沙龙。"
    />
    <title>IXD · STAR MAP / ANALYSIS OS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // These critical endpoints match palette.ts before the application loads.
      // The same variables continue to be owned by paintTheme after startup.
      let entryPrefs = {};
      try { entryPrefs = JSON.parse(localStorage.getItem('rhine-settings') || '{}') || {}; } catch {}
      const entryDark = entryPrefs.colorTheme === 'dark';
      const entryRoot = document.documentElement;
      for (const [name, colors] of Object.entries({
        paper: ['#eef2f8', '#111722'], panel: ['#f8faff', '#1b2434'],
        field: ['#e5ebf5', '#253149'], ink: ['#1c2638', '#e8edf7'],
        line: ['#c4cddd', '#44526c'],
      })) entryRoot.style.setProperty('--theme-' + name, colors[entryDark ? 1 : 0]);
      entryRoot.dataset.darkSurface = String(entryDark);
      entryRoot.dataset.terminalMotionPaused = String(document.hidden || (entryPrefs.reduced ?? matchMedia('(prefers-reduced-motion: reduce)').matches));
    </script>
    <style>
      :root { --ixd-preparation-duration: 1500ms; --ixd-preparation-reveal: .24; }
      html, body { margin: 0; background: var(--theme-paper, #eef2f8); }
      #viewport { position: relative; width: 100vw; height: 100dvh; overflow: hidden; }
      #boot-background.terminal-background { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(ellipse at 51% 48%, var(--theme-panel, #f8faff) 0%, var(--theme-paper, #eef2f8) 76%, var(--theme-field, #e5ebf5) 100%); }
      [data-dark-surface="true"] #boot-background.terminal-background { background: radial-gradient(ellipse at 51% 48%, var(--theme-panel), var(--theme-paper) 76%); }
      [data-dark-surface="true"] #boot-background.terminal-background svg > g { stroke: var(--theme-line); }
      #boot-background.terminal-background > svg { display: block; width: 100%; height: 100%; opacity: .09; filter: blur(3px); animation: terminal-background-drift 48s ease-in-out infinite alternate; }
      #boot-background.terminal-background > .boot-white { display: none; }
      [data-terminal-motion-paused="true"] #boot-background.terminal-background > svg { animation-play-state: paused; }
      #viewport[data-terminal-background="shared"] > #stage { background: transparent; }
      #viewport[data-terminal-background="shared"][data-experience="preparing"] > #stage { visibility: hidden; }
      .startup-preparation { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; color: var(--theme-ink, #1c2638); font-family: MiSans, sans-serif; }
      .startup-preparation[hidden] { display: none; }
      .preparation-access { width: min(440px, 90vw); height: 28px; text-align: center; font-size: clamp(13px, 1.25vw, 20px); letter-spacing: .04em; white-space: nowrap; }
      .preparation-access > span { display: inline-block; animation: preparation-letters calc(var(--ixd-preparation-duration) * var(--ixd-preparation-reveal)) steps(26, end) both; }
      .preparation-connection { margin-top: 30px; font-size: clamp(8px, .7vw, 11px); letter-spacing: 2px; opacity: .7; }
      .preparation-track { width: 180px; height: 1px; margin-top: 20px; background: color-mix(in srgb, currentColor 20%, transparent); overflow: hidden; }
      .preparation-track i { display: block; width: 100%; height: 100%; background: currentColor; transform-origin: left; animation: preparation-progress var(--ixd-preparation-duration) linear both; }
      .preparation-state { min-height: 1.4em; margin-top: 20px; font-size: 12px; }
      .preparation-retry { color: inherit; background: none; border: 0; border-bottom: 1px solid; padding: 10px; cursor: pointer; }
      @keyframes preparation-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes preparation-letters { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
      @keyframes terminal-background-drift { from { transform: translate(17.9px, -15.8px) scale(1.08); } to { transform: translate(-17.9px, -48px) scale(1.08); } }
    </style>
  </head>
  <body>
    <main id="viewport" data-terminal-background="shared" data-experience="preparing">
      <div id="boot-background" class="boot-background terminal-background" aria-hidden="true">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none"><g fill="none" stroke="var(--theme-panel, #f8faff)" stroke-width="3"><path d="M-210 705C-45 705 182 704 247 567C337 377 99 306 4 435S27 680 169 631C309 584 227 314 279 111S568-113 568-113"/><path d="M1560-80C1374 114 1671 168 1601 323S1371 367 1431 480S1692 666 1559 787S1329 886 1498 1130"/><circle cx="1450" cy="648" r="346"/><circle cx="1450" cy="648" r="348"/></g></svg>
        <div class="boot-white"></div>
      </div>
      <div id="stage"></div>
      <section id="loading" class="startup-preparation" aria-label="系统启动准备">
        <div class="preparation-access"><span>ACCESS PERMISSION REQUIRED</span></div>
        <span class="preparation-connection">CONNECTING TO INTERNAL DATABASE</span>
        <div class="preparation-track" aria-hidden="true"><i></i></div>
        <div class="preparation-state" role="status"></div>
        <button class="preparation-retry" type="button" hidden onclick="location.reload()">重新载入 →</button>
      </section>
    </main>
    <script>
      const preparation = document.getElementById('loading');
      preparation.dataset.startedAt = String(performance.now());
      // A failed module download must leave a readable recovery action.
      setTimeout(() => {
        if (preparation.isConnected && !preparation.hidden && !preparation.dataset.bound) {
          preparation.querySelector('.preparation-state').textContent = '启动资源尚未就绪，请检查连接后重试。';
          preparation.querySelector('button').hidden = false;
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
