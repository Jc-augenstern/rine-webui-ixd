<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>IXD · 开场动效提案</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 16 16 7 25 16 16 25' fill='none' stroke='%23847bf7' stroke-width='4'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/src/fonts.css"/>
  <style>
    *{box-sizing:border-box} :root{font-family:MiSans,Arial,sans-serif;color:#e9e9e6;background:#111722;font-synthesis:none}body{margin:0}button,select,input{font:inherit}button,select{color:inherit;background:none;border:1px solid #515655;border-radius:3px;cursor:pointer}button{padding:10px 16px}button:hover{background:#ffffff12}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #8d91ff;outline-offset:4px}button[aria-pressed=true]{border-color:#a8aaf9;color:#c9cbff}a{color:inherit;text-decoration:none}header{height:88px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:16px;font-weight:500;letter-spacing:.06em}h1 span{color:#a5b2c8;font-size:11px;margin-left:20px;letter-spacing:.14em}.version{font:11px monospace;color:#a5b2c8;letter-spacing:.12em}.version i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#78d7d0;margin-right:9px}main{padding:0 24px 22px}.screen{--ink:var(--theme-ink);--muted:var(--theme-muted);--line:var(--theme-line);position:relative;height:calc(100dvh - 254px);min-height:350px;overflow:hidden;background:var(--theme-paper);color:var(--ink);transition:background .3s,color .3s}.screen.dark{background:var(--theme-paper)}.ambient{position:absolute;width:100%;height:100%;opacity:.55;pointer-events:none}.dark .ambient{opacity:.05}.brand{position:absolute;left:4%;top:7%;font-size:11px;letter-spacing:.17em}.brand strong{display:block;font-size:23px;font-weight:650;letter-spacing:.12em;margin-bottom:7px}.brand small{display:block;font-size:9px;letter-spacing:.36em;margin-top:5px}.corner{position:absolute;right:4%;top:8%;font:10px monospace;letter-spacing:.12em;color:var(--muted)}.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:clamp(160px,20vw,270px);text-align:center}.logo-wrap{position:relative}.ixd-mark{display:block;width:100%;overflow:visible}.guide{position:absolute;inset:-22px -28px 20px;border:1px solid var(--line);pointer-events:none;opacity:0}.guide:before,.guide:after{content:'';position:absolute;top:50%;width:14px;height:1px;background:var(--muted)}.guide:before{left:-7px}.guide:after{right:-7px}.status{height:24px;font:9px monospace;letter-spacing:.18em;white-space:nowrap;margin:26px -60px 0;color:var(--muted)}.status b{display:inline-block;width:4px;height:4px;background:#8475e9;margin:0 9px 2px 0}.footer{position:absolute;bottom:6%;left:4%;right:4%;display:flex;justify-content:space-between;gap:18px;font:9px monospace;letter-spacing:.12em;color:var(--muted)}.footer span:last-child{color:var(--ink)}.screen.pure .context{visibility:hidden}.screen.pure{background:#fff}.screen.pure.dark{background:var(--theme-paper)}.timeline{height:5px;display:block;width:100%;margin:18px 0;accent-color:#a0a4fa;cursor:pointer}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px}.primary{background:#e8edf7;color:#1c2638;border-color:#e8edf7;min-width:78px}.primary:hover{background:#fff}.time{font:12px monospace;margin:0 10px;color:#a5b2c8;min-width:118px}.spacer{flex:1}select{padding:9px 12px;background:#111722}.caption{display:flex;justify-content:space-between;gap:20px;margin:17px 0 0;font-size:11px;color:#a5b2c8}.caption strong{font-weight:500;color:#e8edf7}.steps{display:flex;gap:28px}.step.active{color:#c5c7ff}.step em{font-style:normal;font:10px monospace;margin-right:8px;color:#a5b2c8}
    @media(min-width:1800px){.center{width:300px}}@media(max-width:700px){header{height:74px;padding:0 20px}h1{font-size:14px}h1 span{display:none}.version{font-size:9px}main{padding:0 12px 20px}.screen{height:calc(100dvh - 305px);min-height:360px}.center{width:175px;top:51%}.brand{left:7%;top:7%;font-size:8px}.brand strong{font-size:18px}.brand small{font-size:7px}.corner{right:7%;font-size:8px}.footer{left:7%;right:7%;font-size:7px}.footer span:last-child{display:none}.toolbar{gap:7px}button{padding:10px 11px}.time{margin:0 2px;min-width:auto}.spacer{display:none}.caption{line-height:1.7;flex-direction:column;gap:7px}.steps{justify-content:space-between;gap:10px}.caption>span{display:none}}
  </style>
</head>
<body>
<header><h1>IXD <span>IDENTITY IN MOTION</span></h1><div class="version"><i></i>动效提案 / 01</div></header>
<main>
  <section class="screen" aria-label="IXD 加载动效预览">
    <svg class="ambient context" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2"><path d="M-210 705C-45 705 182 704 247 567C337 377 99 306 4 435S27 680 169 631C309 584 227 314 279 111S568-113 568-113"/><path d="M1560-80C1374 114 1671 168 1601 323S1371 367 1431 480S1692 666 1559 787S1329 886 1498 1130"/><circle cx="1450" cy="648" r="346"/><circle cx="1450" cy="648" r="350"/></g></svg>
    <div class="brand context"><strong>IXD</strong>SYNTHESIZE INFORMATION<small>ANALYSIS / OS</small></div>
    <div class="corner context">SYSTEM INITIALIZATION ↗</div>
    <div class="center"><div class="logo-wrap"><div class="guide context"></div><div id="mark"></div></div><div class="status context"><b></b><span id="status">ESTABLISHING CONNECTION</span></div></div>
    <div class="footer context"><span>IXD / INTERACTION SYSTEM</span><span>DESIGN PREVIEW · 01</span></div>
  </section>
  <input id="seek" class="timeline" type="range" min="0" max="4.8" value="0" step="0.01" aria-label="动效时间轴"/>
  <div class="toolbar">
    <button id="play" class="primary" aria-label="暂停动效">暂停</button><button id="replay">重播 ↻</button><output class="time" id="time">0.00 / 4.80 s</output>
    <div class="spacer"></div><select id="speed" aria-label="播放速度"><option value=".5">0.5× 慢放</option><option value="1" selected>1× 原速</option></select><button id="loop" aria-pressed="true">循环</button><button id="theme" aria-pressed="false">暗色</button><button id="pure" aria-pressed="false">纯净预览</button>
  </div>
  <div class="caption"><div class="steps"><span class="step"><em>01</em>线条交织</span><span class="step"><em>02</em>箭头推进</span><span class="step"><em>03</em>IXD 显现</span><span class="step"><em>04</em>就绪定格</span></div><span><strong>青 → 蓝 → 紫</strong> · 原生矢量动效 · 4.8 秒</span></div>
</main>
<script type="module" src="/src/ixd-preview.ts"></script>
</body>
</html>
